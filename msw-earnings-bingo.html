<meta charset="UTF-8">
<title>MSW Earnings Bingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#000000;
    --surface:#121415;
    --surface-2:#1c1f21;
    --surface-3:#26292b;
    --border:#2a2d2f;
    --green:#61b44a;
    --green-strong:#79c062;
    --green-soft:rgba(97,180,74,.16);
    --red:#ec3b32;
    --red-strong:#f16c65;
    --red-soft:rgba(236,59,50,.14);
    --text:#f4f6f5;
    --muted:#98a19c;
    --muted-2:#5e6663;
    --font-display:'Sora', 'Segoe UI', sans-serif;
    --font-body:'Manrope', 'Segoe UI', sans-serif;
    --font-mono:'IBM Plex Mono', 'Consolas', monospace;
    --accent:var(--green);
    --accent-strong:var(--green-strong);
    --accent-soft:var(--green-soft);
  }

  :root[data-accent="red"]{
    --accent:var(--red);
    --accent-strong:var(--red-strong);
    --accent-soft:var(--red-soft);
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    height:100vh;
    display:flex;
    flex-direction:column;
  }

  .app{
    max-width:1080px;
    width:100%;
    margin:0 auto;
    padding:0 0 6.5rem;
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
  }

  /* ---------- gear ---------- */
  .gear-btn{
    position:fixed;
    top:1rem;
    right:1rem;
    z-index:40;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:50%;
    width:44px;
    height:44px;
    padding:0;
    font-size:1.15rem;
    line-height:1;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .gear-btn:hover{ background:var(--surface-3); }

  .icon-btn{
    flex:none;
    width:32px;
    height:32px;
    padding:0;
    border-radius:8px;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
    font-size:1rem;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .icon-btn:hover{ background:var(--surface-3); }

  /* ---------- compact / focus mode ---------- */
  body.compact header{
    position:fixed;
    top:.6rem;
    left:.75rem;
    z-index:30;
    padding:0;
    flex-direction:row;
    align-items:center;
  }
  body.compact .logo{
    width:28px;
    height:28px;
    border-radius:9px;
    margin:0;
  }
  body.compact .eyebrow,
  body.compact h1,
  body.compact .tagline{
    display:none;
  }
  body.compact .dock{ display:none; }
  body.compact footer{ display:none; }
  body.compact .app{ padding-bottom:1rem; max-width:none; }
  body.compact main{ padding-top:3rem; }

  /* ---------- header ---------- */
  header{
    padding:1.6rem 3.5rem 1rem;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    flex:none;
  }
  .logo{
    width:44px;
    height:44px;
    border-radius:14px;
    overflow:hidden;
    background:var(--surface-2);
    border:1px solid var(--border);
    margin-bottom:.7rem;
  }
  .logo img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .eyebrow{
    font-size:.68rem;
    font-weight:600;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 .4rem;
  }
  h1{
    font-family:var(--font-display);
    font-weight:800;
    font-size:clamp(1.5rem, 4vw, 2.1rem);
    line-height:1.08;
    margin:0;
    color:var(--text);
    text-wrap:balance;
  }
  .accent{ color:var(--accent); }
  .tagline{
    margin:.6rem auto 0;
    max-width:34rem;
    color:var(--muted);
    font-size:.82rem;
    line-height:1.5;
  }
  .tagline b{ color:var(--text); font-weight:700; }

  /* ---------- layout ---------- */
  main{
    flex:1;
    min-height:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:.5rem 1.5rem;
  }

  .panel{
    background:var(--surface);
    border-radius:20px;
    min-width:0;
  }
  .panel-head{
    padding:1.1rem 1.3rem .3rem;
    font-family:var(--font-display);
    font-weight:700;
    font-size:.95rem;
    color:var(--text);
  }
  .panel-head-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:.75rem;
  }
  .chip-btn{
    width:auto;
    padding:.45rem .85rem;
    font-size:.74rem;
    font-weight:700;
    border-radius:999px;
    background:var(--surface-2);
    border:1px solid var(--border);
    color:var(--text);
  }
  .chip-btn:hover{ background:var(--surface-3); }
  .chip-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .config-summary{
    margin:.4rem 1.3rem 1.1rem;
    font-size:.8rem;
    color:var(--muted);
  }
  .panel-body.collapsed{ display:none; }
  .panel-body{ padding:1.3rem; }

  label{
    display:block;
    font-size:.76rem;
    font-weight:600;
    color:var(--muted);
    margin:0 0 .5rem;
  }
  textarea{
    width:100%;
    min-height:11rem;
    resize:vertical;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:14px;
    color:var(--text);
    font-family:var(--font-body);
    font-size:.86rem;
    line-height:1.55;
    padding:.75rem .85rem;
  }
  input[type="text"]{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:14px;
    color:var(--text);
    font-family:var(--font-body);
    font-size:.86rem;
    padding:.7rem .85rem;
  }
  textarea:focus, input[type="text"]:focus, select:focus, .cell:focus-visible, button:focus-visible{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 3px var(--accent-soft);
  }

  .field{ margin-bottom:1.1rem; }

  .segmented{
    display:flex;
    gap:1.2rem;
  }
  .segmented-item{
    width:auto;
    background:transparent;
    border:none;
    padding:0;
    color:var(--muted-2);
    font-family:var(--font-body);
    font-weight:600;
    font-size:.92rem;
  }
  .segmented-item.active{
    color:var(--text);
    font-weight:800;
  }

  .switch-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:.75rem;
  }
  .switch-row span{ font-size:.88rem; font-weight:600; color:var(--text); }
  .switch{
    position:relative;
    display:inline-block;
    width:42px;
    height:25px;
    flex:none;
  }
  .switch input{
    opacity:0;
    width:100%;
    height:100%;
    margin:0;
    cursor:pointer;
  }
  .switch .track{
    position:absolute;
    inset:0;
    background:var(--surface-3);
    border:1px solid var(--border);
    border-radius:999px;
    transition:background .15s, border-color .15s;
    pointer-events:none;
  }
  .switch .track::after{
    content:'';
    position:absolute;
    top:2px; left:2px;
    width:19px; height:19px;
    background:var(--text);
    border-radius:50%;
    transition:transform .15s;
  }
  .switch input:checked + .track{ background:var(--accent); border-color:var(--accent); }
  .switch input:checked + .track::after{ transform:translateX(17px); background:#04140a; }
  .switch input:disabled + .track{ opacity:.4; }

  .count-line{
    font-size:.76rem;
    color:var(--muted-2);
    margin:-.25rem 0 1.1rem;
  }
  .count-line.err{ color:var(--red); }

  button{
    font-family:var(--font-body);
    font-weight:700;
    font-size:.86rem;
    border-radius:999px;
    padding:.75rem 1rem;
    cursor:pointer;
    border:1px solid transparent;
    width:100%;
  }
  .btn-primary{
    background:var(--accent);
    color:#04140a;
  }
  .btn-primary:hover{ background:var(--accent-strong); }
  .btn-ghost{
    background:transparent;
    border-color:var(--border);
    color:var(--text);
    margin-top:.6rem;
  }
  .btn-ghost:hover{ background:var(--surface-2); border-color:var(--surface-3); }

  .btn-stack{ display:flex; flex-direction:column; }

  /* ---------- board ---------- */
  .board-wrap{
    padding:1.3rem;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .board{
    display:grid;
    gap:.5rem;
    width:100%;
    max-width:620px;
    min-width:0;
  }
  .cell{
    position:relative;
    aspect-ratio:1;
    min-width:0;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:14px;
    color:var(--text);
    font-family:var(--font-body);
    font-weight:600;
    font-size:clamp(.56rem, 1.5vw, .8rem);
    line-height:1.2;
    padding:.4rem;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    overflow:hidden;
    overflow-wrap:break-word;
    word-break:break-word;
    hyphens:auto;
    transition:background .12s, border-color .12s, transform .08s;
  }
  .cell-text{
    display:block;
    width:100%;
    overflow:hidden;
  }
  .cell:hover{ border-color:var(--muted-2); }
  .cell:active{ transform:scale(.96); }
  .cell.marked{
    background:var(--accent);
    border-color:var(--accent);
    color:#04140a;
  }
  .count-badge{
    position:absolute;
    top:4px; right:4px;
    font-size:.6em;
    font-family:var(--font-mono);
    font-weight:600;
    font-variant-numeric:tabular-nums;
    line-height:1;
    color:#f4f6f5;
    background:rgba(0,0,0,.32);
    border-radius:999px;
    padding:.2em .42em;
  }
  .cell.free{
    background:var(--surface-3);
    border-color:var(--muted-2);
    color:var(--muted);
    font-family:var(--font-display);
    font-weight:700;
    font-size:clamp(.6rem, 1.6vw, .82rem);
  }
  .cell.win{
    box-shadow:0 0 0 2px var(--text);
  }

  .board-hint{
    margin-top:1.1rem;
    text-align:center;
  }

  .win-stats{
    margin-top:1rem;
    text-align:left;
    border-top:1px solid var(--border);
    padding-top:.8rem;
  }
  .win-stats.empty{ display:none; }
  .win-stats-title{
    font-size:.7rem;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted-2);
    margin:0 0 .5rem;
  }
  .win-stats ul{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:.35rem;
  }
  .win-stats li{
    display:flex;
    justify-content:space-between;
    gap:.75rem;
    font-size:.82rem;
    color:var(--text);
  }
  .win-stats li .count{
    font-family:var(--font-mono);
    font-weight:600;
    color:var(--accent);
    font-variant-numeric:tabular-nums;
    flex:none;
  }

  /* ---------- bottom dock ---------- */
  .dock{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    z-index:50;
    display:flex;
    justify-content:center;
    gap:.7rem;
    padding:2rem 1.5rem calc(1.1rem + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--bg) 55%, transparent);
    pointer-events:none;
  }
  .dock-btn{
    pointer-events:auto;
    width:auto;
    flex:none;
    min-width:9.5rem;
    background:#eceeef;
    color:#0a0a0a;
    border:none;
    border-radius:999px;
    padding:.95rem 1rem;
    font-family:var(--font-body);
    font-weight:700;
    font-size:.9rem;
  }
  .dock-btn:hover{ background:#ffffff; }

  footer{
    text-align:center;
    padding:.75rem 1.5rem 0;
    flex:none;
  }
  footer .credit{
    font-size:.68rem;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted-2);
  }

  /* ---------- celebration overlay ---------- */
  .overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(6px);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition:opacity .25s;
    padding:1.5rem;
  }
  .overlay.active{ opacity:1; pointer-events:auto; }

  .rocket-fly{
    position:fixed;
    font-size:3rem;
    left:-10vw;
    bottom:-10vh;
    transform:rotate(0deg);
    opacity:0;
  }
  .overlay.active .rocket-fly{
    animation:fly 4.5s linear forwards;
  }
  @keyframes fly{
    0%{ left:-10vw; bottom:-10vh; opacity:1; }
    100%{ left:105vw; bottom:105vh; opacity:1; }
  }
  @media (prefers-reduced-motion: reduce){
    .rocket-fly{ display:none; }
  }

  .sheet{
    position:relative;
    text-align:center;
    border:1px solid var(--border);
    border-radius:24px;
    padding:2.2rem 2rem;
    background:var(--surface);
    transform:scale(.9);
    opacity:0;
    max-width:24rem;
    width:100%;
    max-height:85vh;
    overflow-y:auto;
  }
  .overlay.active .sheet{
    animation:sheet-in .3s ease-out 1.8s forwards;
  }
  @media (prefers-reduced-motion: reduce){
    .overlay.active .sheet{ animation:none; opacity:1; transform:scale(1); }
  }
  @keyframes sheet-in{
    0%{ opacity:0; transform:scale(.85); }
    100%{ opacity:1; transform:scale(1); }
  }

  .settings-sheet{
    position:relative;
    text-align:left;
    border:1px solid var(--border);
    border-radius:24px;
    padding:1.5rem;
    background:var(--surface);
    max-width:26rem;
    width:100%;
    max-height:85vh;
    overflow-y:auto;
    transform:scale(.96);
    opacity:0;
  }
  .overlay.active .settings-sheet{
    animation:sheet-in .2s ease-out forwards;
  }
  @media (prefers-reduced-motion: reduce){
    .overlay.active .settings-sheet{ animation:none; opacity:1; transform:scale(1); }
  }
  .settings-sheet .panel-head{ padding:0 0 1rem; }
  .sheet-icon{
    width:56px;
    height:56px;
    border-radius:50%;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:1.7rem;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 1.1rem;
  }
  .sheet h2{
    font-family:var(--font-display);
    font-weight:800;
    color:var(--text);
    font-size:clamp(1.35rem, 4.5vw, 1.7rem);
    margin:0;
  }
  .sheet p{
    margin:.6rem 0 0;
    color:var(--muted);
    font-size:.9rem;
  }
  .sheet button{
    margin-top:1.5rem;
    width:100%;
    padding:.8rem 1.4rem;
  }

  .visually-hidden{
    position:absolute; width:1px; height:1px; overflow:hidden;
    clip:rect(0 0 0 0); white-space:nowrap;
  }

  /* ---------- coachmark tutorial ---------- */
  .coach-overlay{
    position:fixed;
    inset:0;
    z-index:200;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s;
  }
  .coach-overlay.active{ opacity:1; pointer-events:auto; }
  .coach-spotlight{
    position:fixed;
    background:transparent;
    border-radius:16px;
    box-shadow:0 0 0 9999px rgba(0,0,0,.72);
    transition:top .25s ease, left .25s ease, width .25s ease, height .25s ease;
    pointer-events:none;
  }
  .coach-bubble{
    position:fixed;
    max-width:19rem;
    width:calc(100% - 2rem);
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:1.1rem 1.2rem;
    box-shadow:0 12px 32px rgba(0,0,0,.5);
    transition:top .25s ease, left .25s ease;
  }
  .coach-bubble h3{
    font-family:var(--font-display);
    font-weight:800;
    font-size:1rem;
    margin:0 0 .4rem;
    color:var(--text);
  }
  .coach-bubble p{
    margin:0;
    font-size:.85rem;
    line-height:1.5;
    color:var(--muted);
  }
  .coach-bubble-foot{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:.75rem;
    margin-top:1rem;
  }
  .coach-dots{
    display:flex;
    gap:.35rem;
  }
  .coach-dots span{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--surface-3);
  }
  .coach-dots span.active{ background:var(--accent); }
  .coach-actions{
    display:flex;
    align-items:center;
    gap:.6rem;
  }
  .coach-actions.split{
    width:100%;
    justify-content:space-between;
  }
  .coach-actions.split .coach-skip,
  .coach-actions.split .coach-next{
    flex:1;
    text-align:center;
  }
  .coach-skip{
    width:auto;
    background:transparent;
    border:none;
    padding:0;
    color:var(--muted-2);
    font-size:.78rem;
    font-weight:700;
  }
  .coach-skip:hover{ color:var(--muted); }
  .coach-skip.btn-secondary{
    padding:.5rem .95rem;
    font-size:.8rem;
    border-radius:999px;
    background:transparent;
    border:1px solid var(--border);
    color:var(--text);
  }
  .coach-skip.btn-secondary:hover{ background:var(--surface-2); color:var(--text); }
  .coach-next{
    width:auto;
    padding:.5rem .95rem;
    font-size:.8rem;
    border-radius:999px;
    background:var(--accent);
    color:#04140a;
  }
  .coach-next:hover{ background:var(--accent-strong); }
</style>

<div class="app">
  <button type="button" class="gear-btn" id="helpBtn" style="right:8rem;" aria-label="Tutorial anzeigen">❓</button>
  <button type="button" class="gear-btn" id="newCallBtn" style="right:4.5rem;" aria-label="Neuer Earnings Call">🆕</button>

  <main>
    <section class="panel" aria-label="Bingofeld">
      <div class="panel-head panel-head-row">
        <span id="boardTitle">Earnings Call <span class="accent">Bingo</span></span>
        <button type="button" class="icon-btn" id="focusBtn" aria-label="Fokus-Modus">⛶</button>
      </div>
      <div class="board-wrap">
        <div class="board" id="board" role="group" aria-label="Bingo-Raster"></div>
        <p class="count-line board-hint">Klick = Treffer zählen (+1) &nbsp;·&nbsp; Rechtsklick = Treffer abziehen (-1)</p>
      </div>
    </section>
  </main>

  <div class="dock">
    <button type="button" class="dock-btn" id="reshuffleBtn">Neu mischen</button>
    <button type="button" class="dock-btn" id="resetBtn">Zurücksetzen</button>
  </div>

  <footer>
    <p class="credit" id="creditText">Earningsbingo by u/Crash_Fl0</p>
  </footer>
</div>

<div class="overlay" id="settingsOverlay">
  <div class="settings-sheet">
    <div class="panel-head panel-head-row">
      <span>Konfiguration</span>
      <button type="button" class="chip-btn" id="closeSettings">Fertig</button>
    </div>
    <div class="field">
      <label for="callName" id="callNameLabel">Welcher Earnings Call?</label>
      <input type="text" id="callName" placeholder="z. B. NVIDIA" maxlength="40">
    </div>
    <div class="field">
      <label for="words">Begriffe (eine Zeile pro Begriff)</label>
      <textarea id="words" spellcheck="false"></textarea>
    </div>
    <p class="count-line" id="countLine"></p>

    <div class="field">
      <label>Feldgröße</label>
      <div class="segmented" id="sizeSegmented" role="tablist">
        <button type="button" class="segmented-item" data-size="3">3×3</button>
        <button type="button" class="segmented-item" data-size="4">4×4</button>
        <button type="button" class="segmented-item active" data-size="5">5×5</button>
        <button type="button" class="segmented-item" data-size="6">6×6</button>
        <button type="button" class="segmented-item" data-size="7">7×7</button>
      </div>
    </div>

    <div class="field">
      <label>Deponie-Farbe</label>
      <div class="segmented" id="colorSegmented" role="tablist">
        <button type="button" class="segmented-item active" data-color="green">🟢 Grün</button>
        <button type="button" class="segmented-item" data-color="red">🔴 Rot</button>
      </div>
    </div>

    <div class="field">
      <label class="switch-row" id="freeLabel" for="free">
        <span>Freies Feld in der Mitte</span>
        <span class="switch">
          <input type="checkbox" id="free" checked>
          <span class="track"></span>
        </span>
      </label>
    </div>

    <div class="field">
      <label class="switch-row" for="germanize">
        <span>Eindeutschen</span>
        <span class="switch">
          <input type="checkbox" id="germanize">
          <span class="track"></span>
        </span>
      </label>
    </div>

    <div class="btn-stack">
      <button class="btn-primary" id="generateBtn">Feld erstellen</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <span class="rocket-fly" id="rocketFly">🚀</span>
  <div class="sheet">
    <div class="sheet-icon">🚀</div>

  </div>
</div>

<script>
(function(){
  var STORAGE_KEY = 'msw-earnings-bingo-v1';
  var TUTORIAL_KEY = 'msw-earnings-bingo-tutorial-v1';

  var DEFAULT_WORDS = [
    "Guidance","Beat and Raise","Headwinds","Tailwinds","Free Cash Flow",
    "Total Addressable Market","Adjusted EBITDA","Non-GAAP","Double-Digit Growth","Sequential Growth",
    "Year-over-Year","Record Revenue","Operating Leverage","Pricing Power","Book-to-Bill",
    "Expanding Margins","One-Time Charge","Cost Discipline",
    "Unprecedented Demand","Robust Demand","Strong Execution","Best Quarter in Company History","Strong Pipeline",
    "Robust Backlog","Best-in-Class","Long-Term Value Creation","Disciplined Capital Allocation","Path to Profitability",
    "Next Industrial Revolution","Trillion Dollar Market",
    "Artificial Intelligence","Generative AI","Cloud","Data Center","Digital Transformation","Automation",
    "Macro Headwinds","Challenging Environment","Uncertain Macro","Supply Constraints","Inventory Correction",
    "Cautiously Optimistic","FX Headwinds",
    "Great Question","I'll Take That Offline","Let Me Reiterate","Next Question Please","Strategic Priorities"
  ];

  var els = {
    callName: document.getElementById('callName'),
    boardTitle: document.getElementById('boardTitle'),
    words: document.getElementById('words'),
    sizeSegmented: document.getElementById('sizeSegmented'),
    colorSegmented: document.getElementById('colorSegmented'),
    free: document.getElementById('free'),
    freeLabel: document.getElementById('freeLabel'),
    germanize: document.getElementById('germanize'),
    titleWord: document.getElementById('titleWord'),
    creditText: document.getElementById('creditText'),
    callNameLabel: document.getElementById('callNameLabel'),
    countLine: document.getElementById('countLine'),
    gearBtn: document.getElementById('gearBtn'),
    newCallBtn: document.getElementById('newCallBtn'),
    focusBtn: document.getElementById('focusBtn'),
    settingsOverlay: document.getElementById('settingsOverlay'),
    closeSettings: document.getElementById('closeSettings'),
    generateBtn: document.getElementById('generateBtn'),
    reshuffleBtn: document.getElementById('reshuffleBtn'),
    resetBtn: document.getElementById('resetBtn'),
    board: document.getElementById('board'),
    winStats: document.getElementById('winStats'),
    winStatsList: document.getElementById('winStatsList'),
    overlay: document.getElementById('overlay'),
    rocketFly: document.getElementById('rocketFly'),
    closeOverlay: document.getElementById('closeOverlay'),
    helpBtn: document.getElementById('helpBtn'),
    coachOverlay: document.getElementById('coachOverlay'),
    coachSpotlight: document.getElementById('coachSpotlight'),
    coachBubble: document.getElementById('coachBubble'),
    coachTitle: document.getElementById('coachTitle'),
    coachText: document.getElementById('coachText'),
    coachDots: document.getElementById('coachDots'),
    coachActions: document.getElementById('coachActions'),
    coachSkip: document.getElementById('coachSkip'),
    coachNext: document.getElementById('coachNext')
  };

  var state = {
    callName: '',
    pool: [],
    size: 5,
    free: true,
    board: [],
    counts: [],
    found: [],
    accentColor: 'green',
    germanize: false
  };

  function escapeHtml(s){
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function updateBoardTitle(){
    var name = (state.callName || '').trim();
    var suffix = state.germanize ? 'Ernten Anruf' : 'Earnings Call';
    els.boardTitle.innerHTML = name
      ? escapeHtml(name) + ' ' + suffix + ' <span class="accent">Bingo</span>'
      : suffix + ' <span class="accent">Bingo</span>';
    fitBoard();
  }

  function fitBoard(){
    var mainEl = document.querySelector('main');
    var panelHead = document.querySelector('main .panel-head');
    var boardWrap = document.querySelector('.board-wrap');
    var hint = document.querySelector('.board-hint');
    if(!mainEl || !panelHead || !boardWrap || !hint) return;

    var wrapCS = getComputedStyle(boardWrap);
    var padY = parseFloat(wrapCS.paddingTop) + parseFloat(wrapCS.paddingBottom);
    var padX = parseFloat(wrapCS.paddingLeft) + parseFloat(wrapCS.paddingRight);

    var availableHeight = mainEl.clientHeight - panelHead.offsetHeight - padY - hint.offsetHeight - 24;
    var availableWidth = mainEl.clientWidth - padX - 24;

    var cap = document.body.classList.contains('compact') ? 1400 : 620;
    var size = Math.max(200, Math.min(cap, availableWidth, availableHeight));
    els.board.style.width = size + 'px';
    els.board.style.maxWidth = 'none';
    fitCellsText();
  }

  function fitCellsText(){
    var texts = els.board.querySelectorAll('.cell-text');
    for(var i = 0; i < texts.length; i++){
      var span = texts[i];
      var btn = span.parentElement;
      span.style.fontSize = '';
      var cs = getComputedStyle(btn);
      var maxH = btn.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
      var maxW = btn.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      var minFont = 8;
      var font = parseFloat(getComputedStyle(span).fontSize);
      while(font > minFont && (span.scrollHeight > maxH || span.scrollWidth > maxW)){
        font -= 1;
        span.style.fontSize = font + 'px';
      }
    }
  }

  function isMarked(idx){
    var cell = state.board[idx];
    return !!(cell && cell.free) || (state.counts[idx] || 0) > 0;
  }

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return null;
      return JSON.parse(raw);
    }catch(e){ return null; }
  }

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){}
  }

  function parseWords(text){
    return text.split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
  }

  function shuffle(arr){
    var a = arr.slice();
    for(var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  var currentSize = 5;

  function setSize(size){
    currentSize = size;
    var buttons = els.sizeSegmented.querySelectorAll('.segmented-item');
    for(var i = 0; i < buttons.length; i++){
      buttons[i].classList.toggle('active', parseInt(buttons[i].dataset.size, 10) === size);
    }
    updateFreeAvailability();
    updateCountLine();
  }

  function setAccentColor(color){
    state.accentColor = color;
    if(color === 'red'){
      document.documentElement.setAttribute('data-accent', 'red');
    } else {
      document.documentElement.removeAttribute('data-accent');
    }
    var buttons = els.colorSegmented.querySelectorAll('.segmented-item');
    for(var i = 0; i < buttons.length; i++){
      buttons[i].classList.toggle('active', buttons[i].dataset.color === color);
    }
  }

  function setGermanize(on){
    state.germanize = on;
    els.germanize.checked = on;
    document.title = on ? 'MSW Ernten Bingo' : 'MSW Earnings Bingo';
    els.titleWord.textContent = on ? 'Ernten' : 'Earnings';
    els.creditText.textContent = on ? 'Erntenbingo von u/Crash_Fl0' : 'Earningsbingo by u/Crash_Fl0';
    els.callNameLabel.textContent = on ? 'Welcher Ernten Anruf?' : 'Welcher Earnings Call?';
    els.newCallBtn.setAttribute('aria-label', on ? 'Neuer Ernten Anruf' : 'Neuer Earnings Call');
    updateBoardTitle();
  }

  function neededCount(size, free){
    var total = size * size;
    var hasFree = free && size % 2 === 1;
    return hasFree ? total - 1 : total;
  }

  function updateCountLine(){
    var words = parseWords(els.words.value);
    var size = currentSize;
    var free = els.free.checked && size % 2 === 1;
    var need = neededCount(size, free);
    var ok = words.length >= need;
    els.countLine.textContent = words.length + ' Begriffe erfasst – benötigt: ' + need + (ok ? '' : ' (noch ' + (need - words.length) + ' fehlen)');
    els.countLine.classList.toggle('err', !ok);
    return { words: words, size: size, free: free, need: need, ok: ok };
  }

  function updateFreeAvailability(){
    var size = currentSize;
    var odd = size % 2 === 1;
    els.free.disabled = !odd;
    els.freeLabel.classList.toggle('disabled', !odd);
    if(!odd) els.free.checked = false;
  }

  function buildBoard(words, size, free){
    var hasFree = free && size % 2 === 1;
    var need = neededCount(size, free);
    var picked = shuffle(words).slice(0, need);
    var center = hasFree ? Math.floor((size * size) / 2) : -1;
    var board = [];
    var wi = 0;
    for(var i = 0; i < size * size; i++){
      if(i === center){
        board.push({ text: 'FREI', free: true });
      } else {
        board.push({ text: picked[wi++], free: false });
      }
    }
    return board;
  }

  function computeLines(size){
    var lines = [];
    for(var r = 0; r < size; r++){
      var row = [];
      for(var c = 0; c < size; c++) row.push(r * size + c);
      lines.push(row);
    }
    for(var c2 = 0; c2 < size; c2++){
      var col = [];
      for(var r2 = 0; r2 < size; r2++) col.push(r2 * size + c2);
      lines.push(col);
    }
    var d1 = [], d2 = [];
    for(var i = 0; i < size; i++){
      d1.push(i * size + i);
      d2.push(i * size + (size - 1 - i));
    }
    lines.push(d1, d2);
    return lines;
  }

  function renderBoard(){
    var size = state.size;
    els.board.style.gridTemplateColumns = 'repeat(' + size + ', 1fr)';
    els.board.innerHTML = '';
    var lines = computeLines(size);
    var winCells = {};
    state.found.forEach(function(li){
      lines[li].forEach(function(idx){ winCells[idx] = true; });
    });

    state.board.forEach(function(cell, idx){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'cell';
      if(cell.free) btn.classList.add('free');
      if(isMarked(idx)) btn.classList.add('marked');
      if(winCells[idx]) btn.classList.add('win');
      var textSpan = document.createElement('span');
      textSpan.className = 'cell-text';
      textSpan.textContent = cell.text;
      btn.appendChild(textSpan);
      if(!cell.free){
        var count = state.counts[idx] || 0;
        if(count > 0){
          btn.title = count + '× erwähnt – Rechtsklick zum Abziehen';
          var badge = document.createElement('span');
          badge.className = 'count-badge';
          badge.textContent = '×' + count;
          btn.appendChild(badge);
        }
        btn.addEventListener('click', function(){ incrementCell(idx); });
        btn.addEventListener('contextmenu', function(e){ e.preventDefault(); decrementCell(idx); });
      } else {
        btn.disabled = true;
      }
      els.board.appendChild(btn);
    });
    fitBoard();
  }

  function incrementCell(idx){
    if(state.board[idx].free) return;
    state.counts[idx] = (state.counts[idx] || 0) + 1;
    checkForBingo();
    renderBoard();
    saveState();
  }

  function decrementCell(idx){
    if(state.board[idx].free) return;
    if(!state.counts[idx]) return;
    state.counts[idx] -= 1;
    renderBoard();
    saveState();
  }

  function checkForBingo(){
    var lines = computeLines(state.size);
    var newlyFound = false;
    lines.forEach(function(line, li){
      if(state.found.indexOf(li) !== -1) return;
      var complete = line.every(function(idx){ return isMarked(idx); });
      if(complete){
        state.found.push(li);
        newlyFound = true;
      }
    });
    if(newlyFound) triggerCelebration();
  }

  function renderWinStats(){
    var items = [];
    state.board.forEach(function(cell, idx){
      if(cell.free) return;
      var count = state.counts[idx] || 0;
      if(count > 0) items.push({ text: cell.text, count: count });
    });
    items.sort(function(a, b){ return b.count - a.count; });

    els.winStatsList.innerHTML = '';
    items.forEach(function(it){
      var li = document.createElement('li');
      var label = document.createElement('span');
      label.textContent = it.text;
      var count = document.createElement('span');
      count.className = 'count';
      count.textContent = '×' + it.count;
      li.appendChild(label);
      li.appendChild(count);
      els.winStatsList.appendChild(li);
    });
    els.winStats.classList.toggle('empty', items.length === 0);
  }

  function triggerCelebration(){
    renderWinStats();
    els.overlay.classList.remove('active');
    els.rocketFly.style.animation = 'none';
    void els.rocketFly.offsetWidth;
    els.rocketFly.style.animation = '';
    els.overlay.classList.add('active');
  }

  function dismissCelebration(){
    els.overlay.classList.remove('active');
  }

  function generate(){
    var check = updateCountLine();
    if(!check.ok) return;
    state.pool = check.words;
    state.size = check.size;
    state.free = check.free;
    state.board = buildBoard(state.pool, state.size, state.free);
    state.counts = state.board.map(function(){ return 0; });
    state.found = [];
    renderBoard();
    closeSettings();
    saveState();
  }

  function reshuffle(){
    if(!state.pool.length) return generate();
    state.board = buildBoard(state.pool, state.size, state.free);
    state.counts = state.board.map(function(){ return 0; });
    state.found = [];
    renderBoard();
    saveState();
  }

  function resetMarks(){
    state.counts = state.board.map(function(){ return 0; });
    state.found = [];
    renderBoard();
    saveState();
  }

  function toggleCompact(){
    var isCompact = document.body.classList.toggle('compact');
    els.focusBtn.setAttribute('aria-label', isCompact ? 'Fokus-Modus verlassen' : 'Fokus-Modus');
    fitBoard();
  }

  function openSettings(){
    els.settingsOverlay.classList.add('active');
  }

  function closeSettings(){
    els.settingsOverlay.classList.remove('active');
  }

  function startNewCall(){
    state.callName = '';
    els.callName.value = '';
    updateBoardTitle();
    state.counts = state.board.map(function(){ return 0; });
    state.found = [];
    renderBoard();
    saveState();
    openSettings();
    els.callName.focus();
  }

  /* ---------- coachmark tutorial ---------- */
  var COACH_STEPS = [
    {
      welcome: true,
      target: function(){ return null; },
      title: 'Kurze Einführung?',
      text: 'Muss ich dir zeigen, wie\'s geht, oder machst du das wie beim Investieren: Augen zu und durch?',
      skipLabel: 'Ich komm klar',
      nextLabel: 'Zeig mir\'s'
    },
    {
      target: function(){ return els.gearBtn; },
      title: 'Begriffe & Größe',
      text: 'Zuerst richtest du hier deine Begriffe, die Feldgröße (3×3 bis 7×7) und das Freifeld in der Mitte ein.'
    },
    {
      target: function(){ return els.board; },
      title: 'So markierst du Treffer',
      text: 'Klick auf ein Feld zählt einen Treffer (+1). Rechtsklick auf ein Feld zieht ihn wieder ab (-1).'
    },
    {
      target: function(){ return els.newCallBtn; },
      title: 'Neuer Call',
      text: 'Startet einen neuen Earnings Call: Name und Treffer werden zurückgesetzt, die Konfiguration öffnet sich direkt.'
    },
    {
      target: function(){ return els.focusBtn; },
      title: 'Fokus-Modus',
      text: 'Blendet Kopfzeile und Buttons aus, damit nur das Feld übrig bleibt – praktisch beim Bildschirmteilen.'
    },
    {
      target: function(){ return document.querySelector('.dock'); },
      title: 'Neu mischen & Zurücksetzen',
      text: '„Neu mischen“ verlost die Begriffe neu. „Zurücksetzen“ löscht nur die Treffer, das Feld bleibt gleich.'
    }
  ];
  var coachIndex = 0;

  function positionCoach(step){
    var target = step.target();
    var bubbleW = Math.min(304, window.innerWidth - 32);
    els.coachBubble.style.width = bubbleW + 'px';

    if(!target){
      els.coachSpotlight.style.left = (window.innerWidth / 2) + 'px';
      els.coachSpotlight.style.top = (window.innerHeight / 2) + 'px';
      els.coachSpotlight.style.width = '0px';
      els.coachSpotlight.style.height = '0px';

      var bubbleRect0 = els.coachBubble.getBoundingClientRect();
      var bubbleH0 = bubbleRect0.height || 140;
      els.coachBubble.style.top = Math.max(12, (window.innerHeight - bubbleH0) / 2) + 'px';
      els.coachBubble.style.left = Math.max(16, (window.innerWidth - bubbleW) / 2) + 'px';
      return true;
    }

    var rect = target.getBoundingClientRect();
    var pad = 8;
    var sx = rect.left - pad, sy = rect.top - pad;
    var sw = rect.width + pad * 2, sh = rect.height + pad * 2;
    els.coachSpotlight.style.left = sx + 'px';
    els.coachSpotlight.style.top = sy + 'px';
    els.coachSpotlight.style.width = sw + 'px';
    els.coachSpotlight.style.height = sh + 'px';

    var bubbleRect = els.coachBubble.getBoundingClientRect();
    var bubbleH = bubbleRect.height || 140;

    var top;
    var spaceBelow = window.innerHeight - (sy + sh);
    var spaceAbove = sy;
    if(spaceBelow >= bubbleH + 16){
      top = sy + sh + 12;
    } else if(spaceAbove >= bubbleH + 16){
      top = sy - bubbleH - 12;
    } else {
      top = Math.max(12, Math.min(window.innerHeight - bubbleH - 12, sy + sh + 12));
    }

    var left = sx + sw / 2 - bubbleW / 2;
    left = Math.max(16, Math.min(window.innerWidth - bubbleW - 16, left));

    els.coachBubble.style.top = top + 'px';
    els.coachBubble.style.left = left + 'px';
    return true;
  }

  function germanizeStr(s){
    if(!state.germanize) return s;
    return s.replace('Neuer Call', 'Neuer Anruf').replace('neuen Earnings Call', 'neuen Ernten Anruf');
  }

  function renderCoachStep(){
    var step = COACH_STEPS[coachIndex];
    if(!step || !positionCoach(step)){
      endTutorial();
      return;
    }
    els.coachTitle.textContent = germanizeStr(step.title);
    els.coachText.textContent = germanizeStr(step.text);
    els.coachSkip.textContent = step.skipLabel || 'Überspringen';
    els.coachNext.textContent = step.nextLabel || (coachIndex === COACH_STEPS.length - 1 ? 'Los geht\'s' : 'Weiter');
    els.coachActions.classList.toggle('split', !!step.welcome);
    els.coachSkip.classList.toggle('btn-secondary', !!step.welcome);

    els.coachDots.innerHTML = '';
    els.coachDots.classList.toggle('visually-hidden', !!step.welcome);
    COACH_STEPS.forEach(function(s, i){
      if(s.welcome) return;
      var dot = document.createElement('span');
      if(i === coachIndex) dot.classList.add('active');
      els.coachDots.appendChild(dot);
    });
  }

  function startTutorial(){
    coachIndex = 0;
    els.coachOverlay.classList.add('active');
    els.coachOverlay.setAttribute('aria-hidden', 'false');
    renderCoachStep();
  }

  function nextCoachStep(){
    coachIndex += 1;
    if(coachIndex >= COACH_STEPS.length){
      endTutorial();
      return;
    }
    renderCoachStep();
  }

  function endTutorial(){
    els.coachOverlay.classList.remove('active');
    els.coachOverlay.setAttribute('aria-hidden', 'true');
    try{ localStorage.setItem(TUTORIAL_KEY, '1'); }catch(e){}
  }

  function maybeAutoStartTutorial(){
    var seen = null;
    try{ seen = localStorage.getItem(TUTORIAL_KEY); }catch(e){}
    if(!seen) startTutorial();
  }

  function init(){
    var saved = loadState();
    if(saved && saved.board && saved.board.length){
      state = saved;
      els.words.value = state.pool.join('\n');
      els.free.checked = state.free;
      els.callName.value = state.callName || '';
      setGermanize(!!state.germanize);
      updateBoardTitle();
      setSize(state.size);
      setAccentColor(state.accentColor || 'green');
      renderBoard();
    } else {
      els.words.value = DEFAULT_WORDS.join('\n');
      setSize(currentSize);
      setAccentColor(state.accentColor || 'green');
      setGermanize(false);
      generate();
    }

    els.words.addEventListener('input', updateCountLine);
    els.callName.addEventListener('input', function(){
      state.callName = els.callName.value;
      updateBoardTitle();
      saveState();
    });
    els.sizeSegmented.addEventListener('click', function(e){
      var btn = e.target.closest('.segmented-item');
      if(!btn) return;
      setSize(parseInt(btn.dataset.size, 10));
    });
    els.colorSegmented.addEventListener('click', function(e){
      var btn = e.target.closest('.segmented-item');
      if(!btn) return;
      setAccentColor(btn.dataset.color);
      saveState();
    });
    els.free.addEventListener('change', updateCountLine);
    els.germanize.addEventListener('change', function(){
      setGermanize(els.germanize.checked);
      saveState();
    });
    els.gearBtn.addEventListener('click', openSettings);
    els.newCallBtn.addEventListener('click', startNewCall);
    els.focusBtn.addEventListener('click', toggleCompact);
    els.closeSettings.addEventListener('click', closeSettings);
    els.settingsOverlay.addEventListener('click', function(e){
      if(e.target === els.settingsOverlay) closeSettings();
    });
    els.generateBtn.addEventListener('click', generate);
    els.reshuffleBtn.addEventListener('click', reshuffle);
    els.resetBtn.addEventListener('click', resetMarks);
    els.closeOverlay.addEventListener('click', dismissCelebration);
    els.overlay.addEventListener('click', function(e){
      if(e.target === els.overlay) dismissCelebration();
    });
    els.helpBtn.addEventListener('click', startTutorial);
    els.coachNext.addEventListener('click', nextCoachStep);
    els.coachSkip.addEventListener('click', endTutorial);
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape'){ dismissCelebration(); closeSettings(); endTutorial(); }
    });

    var resizeTimer = null;
    window.addEventListener('resize', function(){
      if(resizeTimer) return;
      resizeTimer = requestAnimationFrame(function(){
        fitBoard();
        if(els.coachOverlay.classList.contains('active')) renderCoachStep();
        resizeTimer = null;
      });
    });
    fitBoard();
    maybeAutoStartTutorial();
  }

  init();
})();
</script>
